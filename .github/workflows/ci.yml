name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App — typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  theme:
    name: Theme — theme-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g @shopify/cli@latest
      - run: shopify theme check --path theme --fail-level error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    # Non-blocking on purpose: Lighthouse in CI is noisy enough that it belongs
    # in the report, not in the merge gate. See the CI section in docs/roadmap.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Lighthouse against the preview theme
        run: |
          npx --yes @lhci/cli@latest autorun \
            --collect.url="${{ vars.PREVIEW_THEME_URL }}" \
            --collect.numberOfRuns=3 \
            --upload.target=filesystem \
            --upload.outputDir=./lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: ./lhci
