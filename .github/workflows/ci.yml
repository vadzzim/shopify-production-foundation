name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Keep in step with .nvmrc. Node 20 reached end of life on 2026-04-30 and no
  # longer receives security patches.
  NODE_VERSION: 24

jobs:
  app:
    name: App — typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Must match the major version of the lockfile format. Local pnpm is
          # 10.x; on 9 a v10 lockfile fails --frozen-lockfile.
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The root postinstall runs `prisma generate`, so @prisma/client is typed
      # before typecheck. No database is needed for that — generation reads the
      # schema file, not the server.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # `pnpm test -- --coverage` does not work here: pnpm 10 forwards the `--`
      # to vitest, which reads both tokens as test-name filters and produces no
      # coverage at all — quietly, with a green run. Hence a named script.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  theme:
    name: Theme — theme-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm i -g @shopify/cli@latest
      - run: shopify theme check --path theme --fail-level error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    # Non-blocking on purpose: Lighthouse in CI is noisy enough that it belongs
    # in the report, not in the merge gate. See the CI section in docs/roadmap.md.
    continue-on-error: true
    # The preview theme URL is set once the theme is pushed as unpublished
    # (docs/development.md). Without it there is nothing to measure.
    if: vars.PREVIEW_THEME_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run Lighthouse against the preview theme
        run: |
          npx --yes @lhci/cli@latest autorun \
            --collect.url="${{ vars.PREVIEW_THEME_URL }}" \
            --collect.numberOfRuns=3 \
            --upload.target=filesystem \
            --upload.outputDir=./lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: ./lhci
