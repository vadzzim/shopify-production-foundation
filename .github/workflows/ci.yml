name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # The Node the *jobs* run on. Keep in step with .nvmrc — Node 20 reached end
  # of life on 2026-04-30 and no longer receives security patches.
  #
  # Not the same thing as the Node the *actions* run on. Every `uses:` below is
  # a program with its own runtime, declared in its own action.yml, and setting
  # this variable does nothing for those. That is why they are pinned to their
  # node24 majors: GitHub removes Node 20 from hosted runners on 2026-09-16,
  # after which an action still targeting it stops working rather than warning.
  NODE_VERSION: 24

  # The two CLIs installed from npm at job time, pinned to exact versions.
  #
  # `@latest` would defeat the point of this repository: the same commit would
  # be checked by a different tool every month, so a green run would say
  # "this code passes today's theme-check" rather than "this code is correct",
  # and a red one could not be told apart from a rule that did not exist when
  # the commit was written.
  #
  # The cost of pinning is that a new theme-check rule or Lighthouse audit is
  # not noticed until someone bumps these lines. That is the intended trade:
  # tool drift arrives as a reviewable diff instead of as a failure on an
  # unrelated pull request. SHOPIFY_CLI_VERSION is deliberately the version
  # `docs/development.md` expects locally — CI checking the theme with a
  # different CLI than the one that pushes it is how "works locally" starts.
  SHOPIFY_CLI_VERSION: 4.7.1
  LHCI_VERSION: 0.15.1

jobs:
  app:
    name: App — typecheck, lint, test
    runs-on: ubuntu-latest

    # A real PostgreSQL, because two of the guarantees phase 3 rests on are
    # properties of the database and not of our code: `ON CONFLICT DO NOTHING`
    # making a duplicate webhook a no-op (rule 10), and `FOR UPDATE SKIP LOCKED`
    # handing one job to exactly one of two workers (rule 9). A mocked Prisma
    # can only confirm that the method we meant to call was called, so those
    # suites talk to a server — and they skip themselves when DATABASE_URL is
    # unset, which is why it is set here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nordlys
          POSTGRES_PASSWORD: nordlys
          POSTGRES_DB: nordlys
        ports:
          - 5432:5432
        # Without this the job races the container: `migrate deploy` would run
        # against a server that has not finished initialising.
        options: >-
          --health-cmd "pg_isready -U nordlys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nordlys:nordlys@localhost:5432/nordlys?schema=public

    steps:
      - uses: actions/checkout@v7

      # No `version:` here. The action refuses to run when a version is given
      # both in its config and in package.json's `packageManager`, and
      # `packageManager` is the better source: it pins the exact version rather
      # than a major, and Corepack reads the same field locally.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Still needed, and not redundant with the automatic caching
          # setup-node v5 introduced for projects with a `packageManager` field:
          # v6 narrowed that automatic detection to npm only. Without this line
          # a pnpm project silently stops caching its store.
          cache: pnpm
      # The root postinstall runs `prisma generate`, so @prisma/client is typed
      # before typecheck. No database is needed for that — generation reads the
      # schema file, not the server.
      - run: pnpm install --frozen-lockfile
      # `migrate deploy`, not `migrate dev`: it applies the migration files in
      # the repository and nothing else. `dev` would generate a new migration
      # from a schema drift, which is exactly the thing rule 11 exists to stop —
      # and in CI it would do it silently.
      - run: pnpm prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm lint
      # `pnpm test -- --coverage` does not work here: pnpm 10 forwards the `--`
      # to vitest, which reads both tokens as test-name filters and produces no
      # coverage at all — quietly, with a green run. Hence a named script.
      - run: pnpm test:coverage
      # The coverage report is diagnostics a human opens by hand, not a check:
      # this step cannot fail in a way that means "the code is wrong". Letting
      # it fail the job put GitHub's artifact service in the merge gate, and on
      # 2026-09-08 that service returned a 403 from FinalizeArtifact and turned
      # a docs-only commit red with typecheck, lint and test all green.
      #
      # The cost is that a `coverage/` that stops being produced at all now goes
      # unnoticed until someone goes looking for the report. Accepted: the
      # `test:coverage` step above still fails loudly if the run itself breaks,
      # and this one is a convenience on top of it.
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: coverage
          path: coverage/

  theme:
    name: Theme — theme-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm i -g @shopify/cli@${{ env.SHOPIFY_CLI_VERSION }}
      - run: shopify theme check --path theme --fail-level error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    # Non-blocking on purpose: Lighthouse in CI is noisy enough that it belongs
    # in the report, not in the merge gate. See the CI section in docs/roadmap.md.
    continue-on-error: true
    # The preview theme URL is set once the theme is pushed as unpublished
    # (docs/development.md). Without it there is nothing to measure.
    if: vars.PREVIEW_THEME_URL != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run Lighthouse against the preview theme
        run: |
          npx --yes @lhci/cli@${{ env.LHCI_VERSION }} autorun \
            --collect.url="${{ vars.PREVIEW_THEME_URL }}" \
            --collect.numberOfRuns=3 \
            --upload.target=filesystem \
            --upload.outputDir=./lhci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: ./lhci
