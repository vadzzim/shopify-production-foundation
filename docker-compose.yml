# Local PostgreSQL for anyone who doesn't already run one.
# If PostgreSQL is installed locally, skip this file and just set DATABASE_URL.
#
#   docker compose up -d
#   pnpm prisma migrate dev
#
# The point of this file is reproducibility: the project should start for anyone
# who clones the repository, with nothing installed beyond Docker and Node.
#
# Which is why nothing here is named or bound globally. This repository is a
# base to be cloned once per client project, so two or three of them will be
# checked out on the same machine — and a fixed `container_name` plus a fixed
# host port would make those mutually exclusive, with a name conflict on the
# second `up`. Compose derives per-project names from the directory instead, and
# the volume goes with them, so each clone gets its own database.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nordlys
      POSTGRES_PASSWORD: nordlys
      POSTGRES_DB: nordlys
    ports:
      # Override in .env when 5432 is taken — by another clone of this base, or
      # by a PostgreSQL already installed on the host. DATABASE_URL has to name
      # the same port; both live in .env, next to each other.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without a healthcheck, migrations start before the database accepts
      # connections and fail on the very first run.
      test: ["CMD-SHELL", "pg_isready -U nordlys -d nordlys"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
